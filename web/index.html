<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <title>ECLIPSE</title>

  <!-- Added to the home screen, ECLIPSE should open like an app rather than
       a bookmark: no address bar, its own icon, the right colour behind the
       status bar. iOS ignores the manifest's display mode, so it needs its
       own tags saying the same thing. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ECLIPSE">
  <!-- Lets the page draw under the status bar; the safe-area insets in the
       CSS are what keep content out from under the notch. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237C5CFF'/%3E%3Cstop offset='100%25' stop-color='%23FF7A45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='13' r='11' fill='%2308080c'/%3E%3C/svg%3E">
  <script>
    // Set before first paint, synchronously, so there's no flash of the
    // desktop layout — the Fire TV app tags its WebView's user agent, and
    // that's the only signal the page has that it's on a TV, six feet away,
    // driven by a D-pad instead of a mouse.
    if (/ECLIPSE-TV/.test(navigator.userAgent)) document.documentElement.classList.add('tv-mode');
  </script>
  <link rel="stylesheet" href="/css/eclipse.css">
</head>
<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot__mark" aria-hidden="true"></div>
      <span class="boot__word">ECLIPSE</span>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
